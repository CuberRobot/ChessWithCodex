<div id="cb-root">
  <style>
    #cb-root {
      --cb-max: 520px;
      --cb-eval-w: 22px;
      --cb-gap: 10px;
      --cb-piece-white: light-dark(#fbfaf8, #f5f2ec);
      --cb-piece-black: light-dark(#312d29, #262320);
    }
    #cb-root figure {
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: var(--cb-gap);
      width: 100%;
      max-width: var(--cb-frame-max, var(--cb-max));
    }
    #cb-root [hidden] {
      display: none !important;
    }
    #cb-root .cb-status {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 14px;
      justify-content: space-between;
      align-items: baseline;
      font-size: var(--font-size-small);
      color: var(--muted-foreground);
    }
    #cb-root .cb-main {
      display: flex;
      gap: var(--cb-gap);
      align-items: stretch;
      justify-content: flex-start;
    }
    #cb-root .cb-eval {
      flex: 0 0 var(--cb-eval-w);
      width: var(--cb-eval-w);
      border-radius: 4px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      background: var(--cb-piece-black);
      box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--foreground) 14%, transparent);
    }
    #cb-root .cb-eval-fill {
      width: 100%;
      background: var(--cb-piece-white);
    }
    #cb-root .cb-boardwrap {
      flex: 0 1 auto;
      width: 100%;
      max-width: var(--cb-max);
      min-width: 0;
    }
    #cb-root svg.cb-board {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 5px;
    }
    #cb-root .cb-coord {
      font-weight: 500;
    }
    #cb-root .cb-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 16px;
      font-size: var(--font-size-small);
      color: var(--muted-foreground);
    }
    #cb-root .cb-legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    #cb-root .cb-swatch {
      width: 10px;
      height: 10px;
      border-radius: 3px;
      flex: none;
    }
    #cb-root figcaption {
      font-size: var(--font-size-small);
      color: var(--muted-foreground);
      margin: 0;
    }
  </style>

  <figure>
    <div class="cb-status" id="cb-status" hidden></div>
    <div class="cb-main">
      <div class="cb-eval" id="cb-eval" hidden></div>
      <div class="cb-boardwrap" id="cb-boardwrap"></div>
    </div>
    <div class="cb-legend" id="cb-legend" hidden></div>
    <figcaption id="cb-caption" hidden></figcaption>
  </figure>

  <script>
    (() => {
      "use strict";

      const root = document.getElementById("cb-root");
      if (!root || root.dataset.cbRendered === "1") return;
      root.dataset.cbRendered = "1";

      __PIECES_RUNTIME__
      __PIECE_SETS__

      /* 单张棋盘的参数，由 tools/render_board.py 注入。 */
      const CFG = __BOARD_JSON__;
      const cfg = Object.assign(
        {
          fen: "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1",
          orientation: "white",
          theme: "wood",
          coordinates: true,
          status: true,
          maxWidth: 520,
          lastMove: null,
          check: null,
          highlights: [],
          arrows: [],
          markers: [],
          eval: null,
          caption: "",
          pieces: "chessnut",
          title: ""
        },
        CFG
      );

      const THEMES = {
        wood: { light: "light-dark(#f0d9b5, #d9c39c)", dark: "light-dark(#b58863, #9a7150)" },
        green: { light: "light-dark(#eeeed2, #dfe3bd)", dark: "light-dark(#769656, #5f7d43)" },
        slate: { light: "light-dark(#e9e7e2, #d8d5cf)", dark: "light-dark(#8794a3, #6d7a89)" }
      };
      const TONES = {
        focus: { color: "var(--yellow)", opacity: 0.5, label: "关键格" },
        plan: { color: "var(--green)", opacity: 0.28, label: "计划" },
        best: { color: "var(--green)", opacity: 0.28, label: "最佳着" },
        alt: { color: "var(--blue)", opacity: 0.28, label: "备选" },
        threat: { color: "var(--red)", opacity: 0.28, label: "威胁" },
        mistake: { color: "var(--orange)", opacity: 0.3, label: "疑问" },
        blunder: { color: "var(--red)", opacity: 0.32, label: "失误" },
        last: { color: "var(--yellow)", opacity: 0.22, label: "上一着" },
        check: { color: "var(--red)", opacity: 0.6, label: "将军" },
        selected: { color: "var(--primary)", opacity: 0.3, label: "选中" }
      };
      const GLYPHS = { k: "\u265a", q: "\u265b", r: "\u265c", b: "\u265d", n: "\u265e", p: "\u265f" };
      const FILES = "abcdefgh";
      const NS = "http://www.w3.org/2000/svg";

      const pieces = makePieceRenderer(PIECE_SETS, cfg.pieces);
      const themeOf = () => THEMES[cfg.theme] || THEMES.wood;
      const toneOf = (name) => TONES[name] || TONES.focus;

      function parseFen(fen) {
        const parts = String(fen).trim().split(/\s+/);
        const board = {};
        const rows = parts[0].split("/");
        for (let i = 0; i < rows.length; i++) {
          const rank = 8 - i;
          let file = 0;
          for (const ch of rows[i]) {
            if (ch >= "1" && ch <= "8") {
              file += Number(ch);
            } else {
              const lower = ch.toLowerCase();
              if (FILES[file] && GLYPHS[lower]) {
                board[FILES[file] + rank] = { color: ch === lower ? "b" : "w", type: lower };
              }
              file += 1;
            }
          }
        }
        return { board, active: parts[1] === "b" ? "b" : "w", fullmove: Number(parts[5] || 1) };
      }

      function xy(square) {
        if (typeof square !== "string" || square.length < 2) return null;
        const f = FILES.indexOf(square[0].toLowerCase());
        const r = Number(square[1]) - 1;
        if (f < 0 || !(r >= 0 && r <= 7)) return null;
        return cfg.orientation === "black" ? [7 - f, r] : [f, 7 - r];
      }
      function squareAt(vx, vy) {
        const f = cfg.orientation === "black" ? 7 - vx : vx;
        const r = cfg.orientation === "black" ? vy : 7 - vy;
        return FILES[f] + (r + 1);
      }
      const isLight = (vx, vy) => (vx + vy) % 2 === 0;

      function el(tag, attrs) {
        const node = document.createElementNS(NS, tag);
        if (attrs) {
          for (const key in attrs) {
            const value = attrs[key];
            if (value === null || value === undefined || value === false) continue;
            node.setAttribute(key, String(value));
          }
        }
        return node;
      }
      function label(text, attrs) {
        const node = el("text", attrs);
        node.textContent = text;
        return node;
      }

      const layers = [];
      const layer = (name, draw) => layers.push({ name, draw });

      layer("squares", (g) => {
        const t = themeOf();
        g.appendChild(el("rect", { x: 0, y: 0, width: 8, height: 8, fill: t.light }));
        for (let vx = 0; vx < 8; vx++) {
          for (let vy = 0; vy < 8; vy++) {
            if (!isLight(vx, vy)) {
              g.appendChild(el("rect", { x: vx, y: vy, width: 1, height: 1, fill: t.dark }));
            }
          }
        }
      });

      layer("lastMove", (g) => {
        if (!cfg.lastMove || cfg.lastMove.length !== 2) return;
        const t = toneOf("last");
        for (const square of cfg.lastMove) {
          const p = xy(square);
          if (!p) continue;
          g.appendChild(el("rect", { x: p[0], y: p[1], width: 1, height: 1, fill: t.color, opacity: t.opacity }));
        }
      });

      layer("highlightsUnder", (g) => {
        for (const item of cfg.highlights || []) {
          if ((item.style || "fill") === "dot") continue;
          const p = xy(item.square);
          if (!p) continue;
          const t = toneOf(item.tone);
          if ((item.style || "fill") === "ring") {
            g.appendChild(el("circle", {
              cx: p[0] + 0.5, cy: p[1] + 0.5, r: 0.4, fill: "none",
              stroke: t.color, "stroke-width": item.width || 0.09,
              opacity: Math.min(1, t.opacity + 0.35)
            }));
          } else {
            g.appendChild(el("rect", { x: p[0], y: p[1], width: 1, height: 1, fill: t.color, opacity: t.opacity }));
          }
        }
      });

      layer("check", (g) => {
        if (!cfg.check) return;
        const p = xy(cfg.check);
        if (!p) return;
        const t = toneOf("check");
        g.appendChild(el("circle", {
          cx: p[0] + 0.5, cy: p[1] + 0.5, r: 0.46,
          fill: t.color, opacity: t.opacity * 0.55
        }));
      });

      layer("pieces", (g) => {
        const pos = parseFen(cfg.fen);
        for (const square in pos.board) {
          const p = xy(square);
          if (!p) continue;
          const piece = pos.board[square];
          const node = pieces.node(piece.color, piece.type.toUpperCase(), p);
          node.setAttribute("data-square", square);
          g.appendChild(node);
        }
      });

      layer("highlightsOver", (g) => {
        for (const item of cfg.highlights || []) {
          if ((item.style || "fill") !== "dot") continue;
          const p = xy(item.square);
          if (!p) continue;
          const t = toneOf(item.tone);
          g.appendChild(el("circle", {
            cx: p[0] + 0.5, cy: p[1] + 0.5, r: item.radius || 0.15,
            fill: t.color, opacity: Math.min(1, t.opacity + 0.25)
          }));
        }
      });

      layer("arrows", (g) => {
        for (const item of cfg.arrows || []) {
          const a = xy(item.from);
          const b = xy(item.to);
          if (!a || !b) continue;
          const t = toneOf(item.tone);
          const x1 = a[0] + 0.5, y1 = a[1] + 0.5, x2 = b[0] + 0.5, y2 = b[1] + 0.5;
          const dx = x2 - x1, dy = y2 - y1;
          const len = Math.sqrt(dx * dx + dy * dy);
          if (len < 0.001) continue;
          const ux = dx / len, uy = dy / len;
          const opacity = item.opacity || 0.82;
          const shaft = item.width || 0.11;
          const headLen = Math.min(0.34, Math.max(0.22, len * 0.36));
          const headHalf = 0.19;
          const sx = x1 + ux * 0.26, sy = y1 + uy * 0.26;
          const tipX = x2 - ux * 0.12, tipY = y2 - uy * 0.12;
          const baseX = tipX - ux * headLen, baseY = tipY - uy * headLen;
          const px = -uy, py = ux;
          g.appendChild(el("line", {
            x1: sx, y1: sy, x2: baseX, y2: baseY, stroke: t.color,
            "stroke-width": shaft, "stroke-linecap": "round", opacity: opacity
          }));
          g.appendChild(el("polygon", {
            points: [tipX + "," + tipY,
              baseX + px * headHalf + "," + (baseY + py * headHalf),
              baseX - px * headHalf + "," + (baseY - py * headHalf)].join(" "),
            fill: t.color, opacity: opacity
          }));
        }
      });

      layer("markers", (g) => {
        const offsets = { tl: [0.19, 0.2], tr: [0.81, 0.2], bl: [0.19, 0.81], br: [0.81, 0.81] };
        for (const item of cfg.markers || []) {
          const p = xy(item.square);
          if (!p) continue;
          const t = toneOf(item.tone);
          const corner = item.corner || (item.shape === "glyph" ? "br" : "tl");
          const off = offsets[corner] || offsets.tl;
          const cx = p[0] + off[0], cy = p[1] + off[1];
          if (item.shape === "glyph") {
            g.appendChild(label(String(item.text), {
              x: cx, y: cy, "text-anchor": "middle", "dominant-baseline": "central",
              "font-size": 0.36, "font-weight": 500, fill: t.color,
              stroke: "var(--background)", "stroke-width": 0.05, "paint-order": "stroke fill"
            }));
          } else {
            g.appendChild(el("circle", { cx: cx, cy: cy, r: 0.15, fill: t.color, opacity: 0.95 }));
            g.appendChild(label(String(item.text), {
              x: cx, y: cy, "text-anchor": "middle", "dominant-baseline": "central",
              "font-size": 0.22, "font-weight": 500, fill: "var(--background)"
            }));
          }
        }
      });

      layer("coordinates", (g) => {
        if (!cfg.coordinates) return;
        const t = themeOf();
        for (let vx = 0; vx < 8; vx++) {
          for (let vy = 0; vy < 8; vy++) {
            const fill = isLight(vx, vy) ? t.dark : t.light;
            const square = squareAt(vx, vy);
            if (vx === 0) {
              g.appendChild(label(square[1], {
                x: vx + 0.07, y: vy + 0.28, "text-anchor": "start",
                "font-size": 0.21, class: "cb-coord", fill: fill, opacity: 0.9
              }));
            }
            if (vy === 7) {
              g.appendChild(label(square[0], {
                x: vx + 0.92, y: vy + 0.95, "text-anchor": "end",
                "font-size": 0.21, class: "cb-coord", fill: fill, opacity: 0.9
              }));
            }
          }
        }
      });

      layer("frame", (g) => {
        g.appendChild(el("rect", {
          x: 0.012, y: 0.012, width: 7.976, height: 7.976,
          fill: "none", stroke: "var(--border)", "stroke-width": 0.024
        }));
      });

      const pos = parseFen(cfg.fen);
      const svg = el("svg", {
        class: "cb-board",
        viewBox: "0 0 8 8",
        role: "img",
        "aria-labelledby": "cb-svg-title",
        preserveAspectRatio: "xMidYMid meet"
      });
      const svgTitle = el("title", { id: "cb-svg-title" });
      svgTitle.textContent = cfg.title || "国际象棋棋盘：" + cfg.fen;
      const svgDesc = el("desc");
      const descParts = [
        cfg.orientation === "black" ? "黑方视角" : "白方视角",
        pos.active === "w" ? "白方行棋" : "黑方行棋"
      ];
      if ((cfg.arrows || []).length) descParts.push("箭头 " + cfg.arrows.map((a) => a.from + "→" + a.to).join("、"));
      if ((cfg.highlights || []).length) descParts.push("高亮 " + cfg.highlights.map((h) => h.square).join("、"));
      svgDesc.textContent = descParts.join("，");
      svg.appendChild(svgTitle);
      svg.appendChild(svgDesc);
      for (const item of layers) {
        const g = el("g", { "data-layer": item.name });
        item.draw(g);
        svg.appendChild(g);
      }

      const wrap = document.getElementById("cb-boardwrap");
      const boardMax = cfg.maxWidth || 520;
      root.style.setProperty("--cb-max", boardMax + "px");
      root.style.setProperty("--cb-frame-max", boardMax + (cfg.eval ? 32 : 0) + "px");
      wrap.textContent = "";
      wrap.appendChild(svg);

      const status = document.getElementById("cb-status");
      const bits = [];
      if (cfg.status) bits.push((pos.active === "w" ? "白方" : "黑方") + "行棋 · 第 " + pos.fullmove + " 回合");
      if (cfg.eval) bits.push("评估 " + (cfg.eval.label || ""));
      status.textContent = "";
      if (bits.length) {
        for (const bit of bits) {
          const span = document.createElement("span");
          span.textContent = bit;
          status.appendChild(span);
        }
        status.hidden = false;
      }

      const evalEl = document.getElementById("cb-eval");
      if (cfg.eval) {
        const range = 5;
        const value = Math.max(-range, Math.min(range, Number(cfg.eval.white) || 0));
        const pct = Math.max(3, Math.min(97, 50 + (value / (2 * range)) * 100));
        const fill = document.createElement("div");
        fill.className = "cb-eval-fill";
        fill.style.height = pct + "%";
        evalEl.textContent = "";
        evalEl.appendChild(fill);
        evalEl.setAttribute("role", "img");
        evalEl.setAttribute("aria-label", "评估条：" + (cfg.eval.label || ""));
        evalEl.hidden = false;
      }

      const legend = document.getElementById("cb-legend");
      const used = [];
      const note = (name) => {
        if (TONES[name] && TONES[name].label && used.indexOf(name) === -1) used.push(name);
      };
      if (cfg.lastMove) note("last");
      if (cfg.check) note("check");
      (cfg.highlights || []).forEach((h) => note(h.tone));
      (cfg.arrows || []).forEach((a) => note(a.tone));
      (cfg.markers || []).forEach((m) => note(m.tone));
      if (used.length >= 2) {
        legend.textContent = "";
        for (const name of used) {
          const item = document.createElement("span");
          item.className = "cb-legend-item";
          const swatch = document.createElement("span");
          swatch.className = "cb-swatch";
          swatch.style.background = TONES[name].color;
          swatch.style.opacity = "0.85";
          const text = document.createElement("span");
          text.textContent = TONES[name].label;
          item.appendChild(swatch);
          item.appendChild(text);
          legend.appendChild(item);
        }
        legend.hidden = false;
      }

      const caption = document.getElementById("cb-caption");
      if (cfg.caption) {
        caption.textContent = cfg.caption;
        caption.hidden = false;
      }
    })();
  </script>
</div>
